<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十二虎專屬 | 手機直排數據勝率房系統</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;

            background-image: 
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
                url('temple.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #ffffff;
            overflow-x: hidden;
        }

        /* 霧氣 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;

            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.07), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05), transparent 50%),
                radial-gradient(circle at 50% 60%, rgba(255,255,255,0.04), transparent 60%);

            animation: fogMove 25s linear infinite;
        }

        /* 金光 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(circle at 50% 20%, rgba(251,191,36,0.15), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(220,38,38,0.12), transparent 70%);

            mix-blend-mode: screen;
        }

        @keyframes fogMove {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 15px); }
            100% { transform: translate(0, 0); }
        }

        .multiplier-bounce {
            animation: bounce 1.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-8%); }
            50% { transform: translateY(0); }
        }

        /* 高爆房 */
        .glow-row {
            border: 1px solid rgba(251, 191, 36, 0.9);
            box-shadow: 
                0 0 20px rgba(251, 191, 36, 0.5),
                0 0 40px rgba(251, 191, 36, 0.25);
            
            background: linear-gradient(
                90deg, 
                rgba(220, 38, 38, 0.35), 
                rgba(0,0,0,0.3)
            );

            position: relative;
            animation: pulseGlow 2s infinite;
        }

        .glow-row::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(#fbbf24, #fde68a);
            box-shadow: 0 0 10px #fbbf24;
        }

        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 20px rgba(251,191,36,0.4); }
            50% { box-shadow: 0 0 35px rgba(251,191,36,0.7); }
        }

        .btn-pill {
            background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
        }

        #loader {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>

<body>
<div id="loader">Loading...</div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const MultiplierBall = ({ value }) => (
    <div className="w-8 h-8 ml-3 multiplier-bounce flex items-center justify-center bg-red-600 rounded-full text-yellow-200 font-black">
        {value}x
    </div>
);

const App = () => {
    const [rooms, setRooms] = useState([]);

    const generateData = () => {
        const newRooms = Array.from({ length: 6 }, (_, i) => {
            const prob = Math.floor(Math.random() * 45) + 50;
            return {
                id: i,
                roomNo: Math.floor(Math.random() * 2500) + 1,
                probability: prob,
                isHigh: prob > 88,
                multiplier: prob > 88 ? 500 : null
            };
        });
        setRooms(newRooms.sort((a,b)=>b.probability-a.probability));
    };

    useEffect(() => {
        generateData();
        document.getElementById('loader').style.display = 'none';
    }, []);

    return (
        <div className="p-5 max-w-md mx-auto">
            <h1 className="text-center text-2xl font-black mb-6">十二虎數據系統</h1>

            {rooms.map(room => (
                <div key={room.id}
                    className={`p-5 mb-4 rounded-xl flex justify-between ${room.isHigh ? 'glow-row' : 'bg-zinc-900'}`}>
                    
                    <div>
                        <div className="text-xs text-gray-400">房號</div>
                        <div className="text-xl font-bold">第 {room.roomNo} 房</div>
                    </div>

                    <div className="flex items-center">
                        <div className="text-right">
                            <div className="text-xs text-gray-400">勝率</div>
                            <div className="text-xl font-bold">{room.probability}%</div>
                        </div>
                        {room.isHigh && <MultiplierBall value={room.multiplier} />}
                    </div>
                </div>
            ))}

            <button onClick={generateData}
                className="btn-pill w-full h-12 rounded-full mt-6 font-bold">
                刷新數據
            </button>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
