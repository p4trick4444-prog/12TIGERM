<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">十二虎 賽特II數據勝率房</title>

<style>
body{
    font-family:"Microsoft JhengHei",Arial,sans-serif;
    background:
        linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.95)),
        url("temple.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    margin:0;
    padding:10px;
    color:#fff;
    display:flex;
    justify-content:center;
}

.container{
    max-width:600px;
    width:100%;
    text-align:center;
}

h1{
    color:#ffd700;
    font-size:22px;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:15px 0;
}

button{
    width:100%;
    padding:16px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(135deg,#ff3333,#7a0000);
    color:#fff;
}

.loading{
    color:#ff5555;
    font-size:20px;
    margin-top:10px;
}

.success{
    color:#00ff99;
    margin:10px 0;
    font-size:18px;
}

.slot-container{
    display:none;
    grid-template-columns:1fr;
    gap:12px;
    margin-top:10px;
}

.slot{
    background:rgba(15,15,15,.95);
    border-radius:12px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;

    opacity:0;
    transform:translateY(15px);
    transition:.3s;

    border:1px solid #333;
}

.slot.show{
    opacity:1;
    transform:none;
}

.highest{
    border:2px solid #ff2222;
    box-shadow:0 0 15px rgba(255,0,0,.8);
}

.high{
    border:2px solid #ffd700;
    box-shadow:0 0 10px rgba(255,215,0,.7);
}

.room{
    color:#ffd700;
    font-weight:bold;
}

.rate{
    font-weight:bold;
    font-size:20px;
}

@media(min-width:768px){
    .container{max-width:900px;}
    .slot-container{grid-template-columns:repeat(2,1fr);}
}

@media(min-width:1024px){
    .slot-container{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>

<body>
<div class="container">

<h1 id="mainTitle">十二虎 賽特II數據勝率房</h1>

<div class="buttons">
    <button onclick="regenerate()">🔄 數據分析中</button>
    <button onclick="toggleVer()">🔁 切換 I / II</button>
</div>

<div id="loading" class="loading">猛虎下山中…</div>
<div id="success" class="success" style="display:none;">獵殺完成</div>

<div id="slots" class="slot-container"></div>
</div>

<audio id="clickSound" preload="auto">
    <source src="click.wav" type="audio/mpeg">
</audio>

<script>
let version = "II";

const clickSound = document.getElementById("clickSound");

function playClick(){
    if(!clickSound) return;
    clickSound.pause();
    clickSound.currentTime = 0;
    clickSound.play().catch(()=>{});
}

/* ✅ 不重複房號 */
function getUniqueRoom(used){
    let r;
    do{
        r = Math.floor(Math.random()*2500)+1;
    }while(used.has(r));
    used.add(r);
    return r;
}

/* 🎯 固定 6 間房：2紅 + 2金 + 2一般 */
function generateData(){
    const used = new Set();
    let arr = [];

    // 🔴 2 高級
    for(let i=0;i<2;i++){
        arr.push({
            room:getUniqueRoom(used),
            rate:85+Math.floor(Math.random()*11),
            type:"highest"
        });
    }

    // 🟡 2 中高
    for(let i=0;i<2;i++){
        arr.push({
            room:getUniqueRoom(used),
            rate:75+Math.floor(Math.random()*10),
            type:"high"
        });
    }

    // ⚪ 2 普通
    for(let i=0;i<2;i++){
        arr.push({
            room:getUniqueRoom(used),
            rate:50+Math.floor(Math.random()*25),
            type:""
        });
    }

    return arr;
}

function generate(){
    const box = document.getElementById("slots");
    box.innerHTML = "";
    box.style.display = "grid";

    const data = generateData();

    let i = 0;
    function next(){
        if(i >= data.length) return;

        const d = data[i];
        const div = document.createElement("div");

        div.className = "slot " + d.type;
        div.innerHTML = `
            <span class="room">第 ${d.room} 房</span>
            <span class="rate">${d.rate}%</span>
        `;

        box.appendChild(div);

        setTimeout(()=>div.classList.add("show"),30);

        i++;
        setTimeout(next,120);
    }

    next();
}

function regenerate(){
    playClick();

    loading.style.display = "block";
    success.style.display = "none";
    slots.style.display = "none";

    setTimeout(()=>{
        loading.style.display = "none";
        success.style.display = "block";
        generate();
    },1000);
}

function toggleVer(){
    playClick();

    version = version === "II" ? "I" : "II";

    const text = `十二虎專屬賽特${version}數據勝率房`;
    mainTitle.innerText = text;
    pageTitle.innerText = text;

    regenerate();
}

window.onload = regenerate;
</script>

</body>
</html>
